name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Build application
        run: npm run build

  docker-build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t react-devops-assessment:${{ github.sha }} .

      - name: Save Docker image
        run: |
          docker save react-devops-assessment:${{ github.sha }} | gzip > react-app.tar.gz

      - name: Setup SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          EC2_HOST="$(printf '%s' "$EC2_HOST" | tr -d '\r\n' | xargs)"

          echo "Host length: ${#EC2_HOST}"
          echo "Host format check..."

          if [[ ! "$EC2_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: EC2_HOST is not a valid IPv4 address."
            exit 1
          fi

          echo "Host format is valid."

          echo "Testing network connectivity..."
          timeout 10 bash -c "</dev/tcp/$EC2_HOST/22" \
            && echo "Port 22 is reachable." \
            || {
              echo "ERROR: Port 22 is not reachable from GitHub Actions."
              exit 1
            }

          echo "Scanning SSH host key..."
          ssh-keyscan -4 -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "SSH host key scan successful."

      - name: Copy deployment files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -e

          EC2_HOST="$(printf '%s' "$EC2_HOST" | tr -d '\r\n' | xargs)"

          scp -i ~/.ssh/deploy_key \
            react-app.tar.gz \
            "${EC2_USER}@${EC2_HOST}:/tmp/react-app.tar.gz"

          scp -i ~/.ssh/deploy_key \
            deploy/nginx.conf \
            "${EC2_USER}@${EC2_HOST}:/tmp/nginx.conf"

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          EC2_HOST="$(printf '%s' "$EC2_HOST" | tr -d '\r\n' | xargs)"

          ssh -i ~/.ssh/deploy_key \
            "${EC2_USER}@${EC2_HOST}" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" << 'EOF'

          set -Eeuo pipefail

          IMAGE="react-devops-assessment:${IMAGE_TAG}"
          CURRENT_CONTAINER="react-app"
          PREVIOUS_CONTAINER="react-app-previous"

          rollback() {
            echo "Deployment failed. Starting rollback..."

            docker rm -f "$CURRENT_CONTAINER" 2>/dev/null || true

            if docker container inspect "$PREVIOUS_CONTAINER" >/dev/null 2>&1; then
              docker rename "$PREVIOUS_CONTAINER" "$CURRENT_CONTAINER" 2>/dev/null || true
              docker start "$CURRENT_CONTAINER" >/dev/null

              echo "Rollback completed successfully."
            else
              echo "No previous application version is available for rollback."
            fi
          }

          echo "Loading Docker image..."
          gunzip -c /tmp/react-app.tar.gz | docker load

          echo "Validating Nginx configuration..."
          sudo cp /tmp/nginx.conf /etc/nginx/sites-available/default
          sudo nginx -t
          sudo systemctl reload nginx

          echo "Preparing previous application version..."

          if docker container inspect "$CURRENT_CONTAINER" >/dev/null 2>&1; then
            docker stop "$CURRENT_CONTAINER" >/dev/null
            docker rm "$PREVIOUS_CONTAINER" 2>/dev/null || true
            docker rename "$CURRENT_CONTAINER" "$PREVIOUS_CONTAINER"
          fi

          echo "Starting application version: $IMAGE"

          if ! docker run -d \
            --name "$CURRENT_CONTAINER" \
            --restart unless-stopped \
            -p 127.0.0.1:8080:80 \
            "$IMAGE"; then

            rollback
            exit 1
          fi

          echo "Waiting for application..."
          sleep 5

          echo "Running health check..."

          if curl --fail --silent --show-error http://127.0.0.1/ > /dev/null; then
            echo "Health check passed."
            echo "Deployment successful."

            docker rm -f "$PREVIOUS_CONTAINER" 2>/dev/null || true
          else
            echo "Health check failed."

            rollback
            exit 1
          fi

          rm -f /tmp/react-app.tar.gz
          rm -f /tmp/nginx.conf

          EOF